                    type: string
                    example: null
                  to:
                    type: integer
                    example: 1
                  total:
                    type: integer
                    example: 1
      tags:
        - Ajo
  /api/get-invitation:
    get:
      summary: "Get all Ajo invitations created by the authenticated user and invitations they have been added to.\n\nThis endpoint retrieves:\n1. A list of Ajo records where the authenticated user is the inviter, including details and total paid amounts.\n2. A list of invitations where the authenticated user has been invited, including the details of the Ajo and invitation.\n\nBoth lists are paginated through the `per_page` query parameter."
      description: ''
      parameters:
        -
          in: query
          name: per_page
          description: 'The number of items to return per page. Default is 10.'
          example: 15
          required: false
          schema:
            type: integer
            description: 'The number of items to return per page. Default is 10.'
            example: 15
        -
          in: header
          name: Authorization
          description: ''
          example: 'Bearer {YOUR_AUTH_KEY}'
          schema:
            type: string
        -
          in: header
          name: Content-Type
          description: ''
          example: application/json
          schema:
            type: string
        -
          in: header
          name: Accept
          description: ''
          example: application/json
          schema:
            type: string
      responses:
