      parameters:
        -
          in: query
          name: per_page
          description: 'The number of items to return per page. Default is 10.'
          example: 15
          required: false
          schema:
            type: integer
            description: 'The number of items to return per page. Default is 10.'
            example: 15
        -
          in: header
          name: Authorization
          description: ''
          example: 'Bearer {YOUR_AUTH_KEY}'
          schema:
            type: string
        -
          in: header
          name: Content-Type
          description: ''
          example: application/json
          schema:
            type: string
        -
          in: header
          name: Accept
          description: ''
          example: application/json
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  current_page: 1
                  data:
                    -
                      id: 1
                      name: 'Weekly Savings Club'
                      account_number: '1234567890'
                      description: 'Ajo for weekly savings with community participation.'
