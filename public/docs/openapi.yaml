openapi: 3.0.3
info:
  title: Azatme
  description: 'An End-to-End Payment System and Expense Management Solution'
  version: 1.0.0
servers:
  -
    url: azatme.eduland.ng
paths:
  /api/allMerchants:
    get:
      summary: 'Get All Merchants'
      description: 'Retrieve a list of all registered merchants in the system.'
      parameters:
        -
          in: header
          name: Authorization
          description: ''
          example: 'Bearer {YOUR_AUTH_KEY}'
          schema:
            type: string
        -
          in: header
          name: Content-Type
          description: ''
          example: application/json
          schema:
            type: string
        -
          in: header
          name: Accept
          description: ''
          example: application/json
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                example:
                  -
                    id: 12
                    name: sunday
                    email: sunday4oged@yahoo.com
                    usertype: merchant
                    first_name: Sunday
                    last_name: Ogedengbe
                    address: '16 Ijeun street'
                    country: Nigeria
                    state: Osun
                    company_name: null
                    middle_name: femi
                    nimc: '83939303930'
                    bvn: '83939339339'
                    image: null
                    email_verified_at: null
                    phone: '+2348130288477'
                    otp: null
                    created_at: '2023-05-13T17:56:22.000000Z'
                    updated_at: '2024-12-22T14:50:48.000000Z'
                    isVerified: 1
                    enrollment_username: ''
                    nin_bvnDetails: ''
                    accessToken: ''
                    face_image: ''
                    lga_of_origin: ilesa-east
                    gender: Male
                    age: null
                    DOB: '1987-05-05'
                    maiden: null
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No merchants found.'
                properties:
                  message:
                    type: string
                    example: 'No merchants found.'
      tags:
        - Admin
  '/api/get-ajo-by-id/{ajoId}':
    get:
      summary: "Retrieve Ajo data by Ajo ID.\n\nThis endpoint retrieves details of an Ajo entry based on the provided Ajo ID. If the data is found, it returns the details along with a success message. If no data is found, it returns a not found message."
      description: ''
      parameters:
        -
          in: header
          name: Authorization
          description: ''
          example: 'Bearer {YOUR_AUTH_KEY}'
          schema:
            type: string
        -
          in: header
          name: Content-Type
          description: ''
          example: application/json
          schema:
            type: string
        -
          in: header
          name: Accept
          description: ''
          example: application/json
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: successful
                  data:
                    -
                      ajo_id: AJO123456
                      transactionReference: TXN123456
                      email: user@example.com
                      amount: 500
                      status: active
                      created_at: '2024-08-18T00:00:00.000000Z'
                      updated_at: '2024-08-18T00:00:00.000000Z'
                properties:
                  message:
                    type: string
                    example: successful
                  data:
                    type: array
                    example:
                      -
                        ajo_id: AJO123456
                        transactionReference: TXN123456
                        email: user@example.com
                        amount: 500
                        status: active
                        created_at: '2024-08-18T00:00:00.000000Z'
                        updated_at: '2024-08-18T00:00:00.000000Z'
                    items:
                      type: object
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'data not found'
                properties:
                  message:
                    type: string
                    example: 'data not found'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: Unsuccessful
                properties:
                  error:
                    type: string
                    example: Unsuccessful
      tags:
        - Ajo
    parameters:
      -
        in: path
        name: ajoId
        description: 'The unique ID of the Ajo entry.'
        example: AJO123456
        required: true
        schema:
          type: string
  '/api/invitation/{ajoId}':
    post:
      summary: "Invite users to an Ajo.\n\nThis endpoint allows authenticated users to invite other users to join a specific Ajo group. It performs the following actions:\n1. Validates if the number of invitations does not exceed the allowed member count for the Ajo.\n2. Creates invitations for the provided users.\n3. Calculates the payment schedules for the invited users based on the Ajo's frequency.\n4. Interacts with an external API to create a product and get a product ID.\n5. Generates invitation links for the users and sends them via email if they are not the authenticated user."
      description: ''
      parameters:
        -
          in: header
          name: Authorization
          description: ''
          example: 'Bearer {YOUR_AUTH_KEY}'
          schema:
            type: string
        -
          in: header
          name: Content-Type
          description: ''
          example: application/json
          schema:
            type: string
        -
          in: header
          name: Accept
          description: ''
          example: application/json
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 200
                  message: 'Invitations sent successfully'
                  links:
                    - 'https://www.azatme.com/login?invitee_name=JohnDoe&email=johndoe@example.com&inviter_token=abc123&position=Member&productId=12345&ajoId=1&frequency=Monthly&productName=ProductName'
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 'Invitations sent successfully'
                  links:
                    type: array
                    example:
                      - 'https://www.azatme.com/login?invitee_name=JohnDoe&email=johndoe@example.com&inviter_token=abc123&position=Member&productId=12345&ajoId=1&frequency=Monthly&productName=ProductName'
                    items:
                      type: string
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid user data'
                properties:
                  message:
                    type: string
                    example: 'Invalid user data'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Error creating DirectDebitProduct'
                properties:
                  message:
                    type: string
                    example: 'Error creating DirectDebitProduct'
      tags:
        - Ajo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                users:
                  type: array
                  description: 'A list of users to invite.'
                  example:
                    - explicabo
                  items:
                    type: string
                productName:
                  type: string
                  description: 'The name of the product.'
                  example: '"Monthly Subscription"'
                productDescription:
                  type: string
                  description: 'A description of the product.'
                  example: '"A subscription for monthly services."'
              required:
                - users
                - productName
                - productDescription
    parameters:
      -
        in: path
        name: ajoId
        description: ''
        example: 1
        required: true
        schema:
          type: integer
  /api/create-ajo:
    post:
      summary: "Create a new Ajo.\n\nThis endpoint allows authenticated users to create a new Ajo. It requires various details about the Ajo, including its name, account number, description, frequency, member count, starting date, cycle, and the amount per member. Upon successful creation, a unique code is generated for the Ajo. The user ID of the authenticated user is associated with the newly created Ajo."
      description: ''
      parameters:
        -
          in: header
          name: Authorization
          description: ''
          example: 'Bearer {YOUR_AUTH_KEY}'
          schema:
            type: string
        -
          in: header
          name: Content-Type
          description: ''
          example: application/json
          schema:
            type: string
        -
          in: header
          name: Accept
          description: ''
          example: application/json
          schema:
            type: string
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'Weekly Savings Club'
                  account_number: '1234567890'
                  description: 'Ajo for weekly savings with community participation.'
                  unique_code: A1B2C3D4E5
                  frequency: weekly
                  member_count: 20
                  starting_date: '2024-08-01'
                  cycle: '4 weeks'
                  amount_per_member: 5000.0
                  user_id: 1
                  created_at: '2024-08-18T00:00:00.000000Z'
                  updated_at: '2024-08-18T00:00:00.000000Z'
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'Weekly Savings Club'
                  account_number:
                    type: string
                    example: '1234567890'
                  description:
                    type: string
                    example: 'Ajo for weekly savings with community participation.'
                  unique_code:
                    type: string
                    example: A1B2C3D4E5
                  frequency:
                    type: string
                    example: weekly
                  member_count:
                    type: integer
                    example: 20
                  starting_date:
                    type: string
                    example: '2024-08-01'
                  cycle:
                    type: string
                    example: '4 weeks'
                  amount_per_member:
                    type: number
                    example: 5000.0
                  user_id:
                    type: integer
                    example: 1
                  created_at:
                    type: string
                    example: '2024-08-18T00:00:00.000000Z'
                  updated_at:
                    type: string
                    example: '2024-08-18T00:00:00.000000Z'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Validation Error'
                  errors:
                    name:
                      - 'The name field is required.'
                    account_number:
                      - 'The account number field is required.'
                    description:
                      - 'The description field is required.'
                    frequency:
                      - 'The frequency field is required.'
                    member_count:
                      - 'The member count field is required.'
                    starting_date:
                      - 'The starting date field is required.'
                    cycle:
                      - 'The cycle field is required.'
                    amount_per_member:
                      - 'The amount per member field is required.'
                properties:
                  message:
                    type: string
                    example: 'Validation Error'
                  errors:
                    type: object
                    example:
                      name:
                        - 'The name field is required.'
                      account_number:
                        - 'The account number field is required.'
                      description:
                        - 'The description field is required.'
                      frequency:
                        - 'The frequency field is required.'
                      member_count:
                        - 'The member count field is required.'
                      starting_date:
                        - 'The starting date field is required.'
                      cycle:
                        - 'The cycle field is required.'
                      amount_per_member:
                        - 'The amount per member field is required.'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: Unsuccessful
                properties:
                  error:
                    type: string
                    example: Unsuccessful
      tags:
        - Ajo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The name of the Ajo.'
                  example: '"Weekly Savings Club"'
                account_number:
                  type: string
                  description: 'The account number associated with the Ajo.'
                  example: '"1234567890"'
                description:
                  type: string
                  description: 'A brief description of the Ajo.'
                  example: '"Ajo for weekly savings with community participation."'
                frequency:
                  type: string
                  description: 'How often the Ajo cycle occurs.'
                  example: '"weekly"'
                member_count:
                  type: integer
                  description: 'The total number of members in the Ajo.'
                  example: 20
                starting_date:
                  type: string
                  description: 'The start date of the Ajo. Format: YYYY-MM-DD.'
                  example: '"2024-08-01"'
                cycle:
                  type: string
                  description: 'The duration of one complete cycle.'
                  example: '"4 weeks"'
                amount_per_member:
                  type: number
                  description: 'The amount each member contributes per cycle.'
                  example: 5000.0
              required:
                - name
                - account_number
                - description
                - frequency
                - member_count
                - starting_date
                - cycle
                - amount_per_member
  /api/get-ajo-per-user:
    get:
      summary: "Get all Ajo created by the authenticated user.\n\nThis endpoint retrieves all Ajo records created by the currently authenticated user. It supports pagination through the `per_page` query parameter, allowing clients to specify the number of records per page."
