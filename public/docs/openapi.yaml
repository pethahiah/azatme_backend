  /api/image:
    post:
      summary: 'Upload and save a profile image for the authenticated user.'
      description: 'This endpoint allows the authenticated user to upload an image, which is then saved to the server''s storage directory. The image file must be in one of the allowed formats (jpeg, png, jpg, gif). The image path is then saved in the user''s profile.'
      parameters:
        -
          in: header
          name: Authorization
          description: ''
          example: 'Bearer {YOUR_AUTH_KEY}'
          schema:
            type: string
        -
          in: header
          name: Content-Type
          description: ''
          example: multipart/form-data
          schema:
            type: string
        -
          in: header
          name: Accept
          description: ''
          example: application/json
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  image: 'http://yourdomain.com/storage/profiles/image_filename.jpg'
                  user:
                    id: integer
                    name: string
                    email: string
                    image: storage/profiles/image_filename.jpg
                properties:
                  image:
                    type: string
                    example: 'http://yourdomain.com/storage/profiles/image_filename.jpg'
                  user:
                    type: object
                    example:
                      id: integer
                      name: string
                      email: string
                      image: storage/profiles/image_filename.jpg
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    image:
                      - 'The image field is required.'
                      - 'The image must be a file of type: jpeg, png, jpg, gif.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    example:
                      image:
                        - 'The image field is required.'
                        - 'The image must be a file of type: jpeg, png, jpg, gif.'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: 'The image file to upload. Must be in jpeg, png, jpg, or gif format.'
              required:
                - image
