  '/api/get-unpaid-users/{id}':
    get:
      summary: "Retrieve users who have accepted the Ajo invitation but have not made a payment.\n\nThis endpoint retrieves a list of users who have accepted an invitation to an Ajo but have not made a payment. It filters users based on their invitation status and checks if their payment date is in the future."
      description: ''
      parameters:
        -
          in: header
          name: Authorization
          description: ''
          example: 'Bearer {YOUR_AUTH_KEY}'
          schema:
            type: string
        -
          in: header
          name: Content-Type
          description: ''
          example: application/json
          schema:
            type: string
        -
          in: header
          name: Accept
          description: ''
          example: application/json
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "[\n    {\n        \"id\": 1,\n        \"ajo_id\": 1,\n        \"email\": \"user@example.com\",\n        \"status\": \"accept\",\n        \"residualAmount\": null,\n        \"created_at\": \"2024-08-18T00:00:00.000000Z\",\n        \"updated_at\": \"2024-08-18T00:00:00.000000Z\"\n    },\n    ...\n]"
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No unpaid users found for the specified Ajo.'
                properties:
                  message:
                    type: string
                    example: 'No unpaid users found for the specified Ajo.'
      tags:
        - Ajo
    parameters:
      -
        in: path
        name: id
        description: 'The unique identifier of the Ajo to retrieve unpaid users for.'
        example: 1
        required: true
        schema:
          type: integer
  /api/ajo-payout:
    post:
      summary: "Process a payout request for an Ajo account.\n\nThis endpoint allows a user to request a payout from their Ajo account. It performs various checks, applies charges, and interacts with an external service to handle the payout request."
      description: ''
      parameters:
        -
          in: header
          name: Authorization
          description: ''
          example: 'Bearer {YOUR_AUTH_KEY}'
          schema:
            type: string
        -
          in: header
          name: Content-Type
          description: ''
          example: application/json
          schema:
            type: string
        -
          in: header
          name: Accept
          description: ''
          example: application/json
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  transactionReference: abcdef123456
                  status: success
                properties:
                  transactionReference:
                    type: string
                    example: abcdef123456
                  status:
                    type: string
                    example: success
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'You cannot withdraw an amount less than 100 after commission'
                properties:
                  message:
                    type: string
                    example: 'You cannot withdraw an amount less than 100 after commission'
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Bank account not found'
                properties:
                  message:
                    type: string
                    example: 'Bank account not found'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'Access denied. You do not have permission to access this resource.'
                properties:
                  error:
                    type: string
                    example: 'Access denied. You do not have permission to access this resource.'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Payout request failed'
                properties:
                  message:
                    type: string
                    example: 'Payout request failed'
      tags:
        - Ajo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
