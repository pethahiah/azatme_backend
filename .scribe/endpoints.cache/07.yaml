    uri: 'api/user/update/status/{complain_reference_code}'
    metadata:
      title: 'Update the status of an issue.'
      description: |-
        This endpoint allows updating the status of a complaint based on the provided complain reference code.
        If the reference code is found, the status is updated, and a success message is returned.
        Otherwise, an error message is returned indicating that the reference code was not found.
      authenticated: true
      custom: []
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      complain_reference_code:
        name: complain_reference_code
        description: 'The complain reference code for the issue to be updated.'
        required: false
        example: '"ABCD1234"'
        type: string
        custom: []
    queryParameters: []
    bodyParameters:
      status:
        name: status
        description: 'The new status for the issue.'
        required: false
        example: '"resolved"'
        type: string
        custom: []
    responses:
      -
        status: 200
        content: |-
          {
           "message": "Status updated to successfully",
           "data": {
             "complain_reference_code": "ABCD1234",
             "status": "resolved"
           }
          }
        headers: []
        description: '200'
      -
        status: 404
        content: |-
          {
           "message": "Reference code not found"
          }
        headers: []
        description: '404'
    responseFields: []
