        required: true
        example: veniam
        type: string
        custom: []
    queryParameters: []
    bodyParameters:
      email:
        name: email
        description: 'The emails of the users to invite, separated by '';''.'
        required: true
        example: user1@example.com;user2@example.com
        type: string
        custom: []
      paymentType:
        name: paymentType
        description: 'The type of payment.'
        required: false
        example: 1
        type: integer
        custom: []
      expirationTime:
        name: expirationTime
        description: 'The expiration time for the payment link if applicable.'
        required: false
        example: '2024-09-01 00:00:00'
        type: string
        custom: []
      split_method_id:
        name: split_method_id
        description: 'The method used for splitting payments.'
        required: false
        example: 1
        type: integer
        custom: []
      percentage:
        name: percentage
        description: 'The percentage for splitting payments if applicable.'
        required: false
        example: 50.0
        type: number
        custom: []
      percentage_per_user:
        name: percentage_per_user
        description: 'JSON object with user-specific percentages.'
        required: false
        example:
          user1@example.com: 30
          user2@example.com: 70
        type: object
        custom: []
      consent:
        name: consent
        description: 'If consent is required.'
        required: false
        example: true
        type: boolean
        custom: []
      bankName:
        name: bankName
        description: 'The name of the bank.'
        required: false
        example: 'Bank of Example'
        type: string
        custom: []
      account_name:
        name: account_name
        description: 'The name on the account.'
        required: false
        example: 'John Doe'
        type: string
        custom: []
      bankCode:
        name: bankCode
        description: 'The bank code.'
        required: false
        example: '123456'
        type: string
        custom: []
      account_number:
        name: account_number
        description: 'The account number.'
        required: false
        example: '987654321'
        type: string
        custom: []
    responses:
      -
        status: 200
        content: |-
          {
              "transactionReference": "txn_123456",
              "payLink": "https://paythru.com/transaction/abc123"
          }
        headers: []
        description: '200'
      -
        status: 401
        content: |-
          {
              "message": "Id doesn't belong to this transaction category"
          }
        headers: []
        description: '401'
      -
        status: 403
        content: |-
          {
              "error": "Access denied. You do not have permission to access this resource."
