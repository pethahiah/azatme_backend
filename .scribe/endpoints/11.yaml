name: Kontribute
description: ''
endpoints:
  -
    httpMethods:
      - GET
    uri: api/count-all-added-users-kontribute
    metadata:
      title: |-
        Count the number of users added to a specific Kontribute group by ID.

        This endpoint returns the count of users associated with a given `kontributeId` if the authenticated user is an admin.
        If the user is not an admin, an authorization error is returned.
      description: ''
      authenticated: true
      custom: []
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      kontributeId:
        name: kontributeId
        description: 'The ID of the Kontribute group.'
        required: true
        example: 1
        type: integer
        custom: []
    queryParameters: []
    bodyParameters: []
    responses:
      -
        status: 200
        content: |-
          {
              "count": 10
          }
        headers: []
        description: '200'
      -
        status: 403
        content: |-
          {
              "error": "Auth user is not an admin"
          }
        headers: []
        description: '403'
      -
        status: 500
        content: |-
          {
              "error": "Unsuccessful"
          }
        headers: []
        description: '500'
    responseFields: []
