name: Expenses
description: ''
endpoints:
  -
    httpMethods:
      - GET
    uri: api/count-all-added-users-refundme
    metadata:
      title: |-
        Count the number of users associated with a specific expense ID.

        This endpoint returns the count of users associated with the given `refundmeId` if the authenticated user is an admin.
        If the user is not an admin, an authorization error is returned.
      description: ''
      authenticated: true
      custom: []
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      refundmeId:
        name: refundmeId
        description: 'The ID of the expense.'
        required: true
        example: 1
        type: integer
        custom: []
    queryParameters: []
    bodyParameters: []
    responses:
      -
        status: 200
        content: |-
          {
              "count": 5
          }
        headers: []
        description: '200'
      -
        status: 403
        content: |-
          {
              "error": "Auth user is not an admin"
          }
        headers: []
        description: '403'
      -
        status: 404
        content: |-
          {
              "error": "Expense not found"
          }
        headers: []
        description: '404'
      -
        status: 500
        content: |-
          {
              "error": "Unsuccessful"
          }
        headers: []
        description: '500'
    responseFields: []
  -
    httpMethods:
      - GET
    uri: api/count-all-active-users-refundme
    metadata:
      title: |-
        Count the number of active expenses for a given ID.

        This endpoint returns the count of active expenses for a specific `refundmeId` if the authenticated user is an admin.
        If the user is not an admin, an authorization error is returned.
      description: ''
      authenticated: true
      custom: []
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      refundmeId:
        name: refundmeId
        description: 'The ID of the expense to count.'
        required: true
        example: 1
        type: integer
        custom: []
    queryParameters: []
    bodyParameters: []
    responses:
      -
        status: 200
        content: |-
          {
              "count": 5
          }
        headers: []
        description: '200'
      -
        status: 403
        content: |-
          {
              "error": "Auth user is not an admin"
          }
        headers: []
        description: '403'
      -
        status: 500
        content: |-
          {
              "error": "Unsuccessful"
          }
        headers: []
        description: '500'
    responseFields: []
