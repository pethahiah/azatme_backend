    httpMethods:
      - POST
    uri: api/nqr-merchant-registration
    metadata:
      title: |-
        API endpoints for nqr management.
        Register a new merchant.
      description: ''
      authenticated: true
      custom: []
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    queryParameters: []
    bodyParameters:
      name:
        name: name
        description: 'The name of the merchant.'
        required: true
        example: 'John Doe Ltd.'
        type: string
        custom: []
      tin:
        name: tin
        description: 'The TIN of the merchant.'
        required: true
        example: '123456789'
        type: string
        custom: []
      contact:
        name: contact
        description: 'The contact person for the merchant.'
        required: true
        example: 'John Doe'
        type: string
        custom: []
      phone:
        name: phone
        description: 'The phone number of the merchant.'
        required: true
        example: '08012345678'
        type: string
        custom: []
      email:
        name: email
        description: 'The email address of the merchant.'
        required: true
        example: john.doe@example.com
        type: string
        custom: []
      address:
        name: address
        description: 'The address of the merchant.'
        required: true
        example: '123 Merchant St.'
        type: string
        custom: []
      bankNo:
        name: bankNo
        description: 'The bank number.'
        required: true
        example: '12345'
        type: string
        custom: []
      accountName:
        name: accountName
        description: 'The account name.'
        required: true
        example: 'John Doe Ltd.'
        type: string
        custom: []
      accountNumber:
        name: accountNumber
        description: 'The account number.'
        required: true
        example: '1234567890'
        type: string
        custom: []
      remarks:
        name: remarks
        description: 'Optional Additional remarks.'
        required: false
        example: 'Registered for NQR.'
        type: string
        custom: []
    responses:
      -
        status: 200
        content: |-
          {
            "merchantNumber": "123456",
            "qrCode": "https://example.com/qr/123456"
          }
        headers: []
        description: '200'
      -
        status: 403
        content: |-
          {
            "error": "Access denied. You do not have permission to access this resource."
          }
        headers: []
        description: '403'
      -
        status: 500
        content: |-
          {
            "message": "Invalid response from API."
          }
        headers: []
        description: '500'
    responseFields: []
