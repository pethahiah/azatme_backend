name: Ajo
description: ''
endpoints:
  -
    httpMethods:
      - GET
    uri: 'api/get-ajo-by-id/{ajoId}'
    metadata:
      title: |-
        Retrieve Ajo data by Ajo ID.

        This endpoint retrieves details of an Ajo entry based on the provided Ajo ID. If the data is found, it returns the details along with a success message. If no data is found, it returns a not found message.
      description: ''
      authenticated: true
      custom: []
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      ajoId:
        name: ajoId
        description: 'The unique ID of the Ajo entry.'
        required: true
        example: AJO123456
        type: string
        custom: []
    queryParameters: []
    bodyParameters: []
    responses:
      -
        status: 200
        content: |-
          {
              "message": "successful",
              "data": [
                  {
                      "ajo_id": "AJO123456",
                      "transactionReference": "TXN123456",
                      "email": "user@example.com",
                      "amount": 500,
                      "status": "active",
                      "created_at": "2024-08-18T00:00:00.000000Z",
                      "updated_at": "2024-08-18T00:00:00.000000Z"
                  }
              ]
          }
        headers: []
        description: '200'
      -
        status: 404
        content: |-
          {
              "message": "data not found"
          }
        headers: []
        description: '404'
      -
        status: 500
        content: |-
          {
              "error": "Unsuccessful"
          }
        headers: []
        description: '500'
    responseFields: []
  -
    httpMethods:
      - POST
    uri: 'api/invitation/{ajoId}'
    metadata:
      title: |-
        Invite users to an Ajo.

        This endpoint allows authenticated users to invite other users to join a specific Ajo group. It performs the following actions:
        1. Validates if the number of invitations does not exceed the allowed member count for the Ajo.
        2. Creates invitations for the provided users.
        3. Calculates the payment schedules for the invited users based on the Ajo's frequency.
        4. Interacts with an external API to create a product and get a product ID.
        5. Generates invitation links for the users and sends them via email if they are not the authenticated user.
      description: ''
      authenticated: true
      custom: []
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      ajoId:
        name: ajoId
        description: ''
        required: true
        example: 1
        type: integer
        custom: []
    queryParameters: []
    bodyParameters:
      users:
        name: users
        description: 'A list of users to invite.'
        required: true
        example:
          - explicabo
        type: 'string[]'
        custom: []
      users.email:
        name: users.email
        description: 'The email address of the user to invite.'
        required: true
        example: '"johndoe@example.com"'
        type: string
        custom: []
      users.name:
        name: users.name
        description: 'optional The name of the user.'
        required: false
        example: '"John Doe"'
        type: string
        custom: []
      users.phone_number:
        name: users.phone_number
        description: 'optional The phone number of the user.'
        required: false
        example: '"+1234567890"'
        type: string
        custom: []
      users.position:
        name: users.position
        description: 'optional The position of the user within the Ajo group.'
        required: false
        example: '"Member"'
        type: string
        custom: []
      productName:
        name: productName
        description: 'The name of the product.'
        required: true
        example: '"Monthly Subscription"'
        type: string
        custom: []
      productDescription:
        name: productDescription
        description: 'A description of the product.'
        required: true
        example: '"A subscription for monthly services."'
        type: string
        custom: []
    responses:
      -
        status: 200
        content: |-
          {
              "status": 200,
              "message": "Invitations sent successfully",
              "links": [
                  "https://www.azatme.com/login?invitee_name=JohnDoe&email=johndoe@example.com&inviter_token=abc123&position=Member&productId=12345&ajoId=1&frequency=Monthly&productName=ProductName"
              ]
          }
        headers: []
        description: '200'
      -
        status: 400
        content: |-
          {
              "message": "Members cannot be more than X"
          }
        headers: []
        description: '400'
      -
        status: 400
        content: |-
          {
              "message": "Invalid user data"
          }
        headers: []
        description: '400'
      -
        status: 500
        content: |-
          {
              "message": "Error in response from API"
          }
        headers: []
        description: '500'
      -
        status: 500
        content: |-
          {
              "message": "API request failed"
          }
        headers: []
        description: '500'
      -
        status: 500
        content: |-
          {
              "message": "Error creating DirectDebitProduct"
          }
        headers: []
        description: '500'
    responseFields: []
  -
    httpMethods:
      - POST
    uri: api/create-ajo
    metadata:
      title: |-
        Create a new Ajo.

        This endpoint allows authenticated users to create a new Ajo. It requires various details about the Ajo, including its name, account number, description, frequency, member count, starting date, cycle, and the amount per member. Upon successful creation, a unique code is generated for the Ajo. The user ID of the authenticated user is associated with the newly created Ajo.
      description: ''
      authenticated: true
      custom: []
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    queryParameters: []
    bodyParameters:
      name:
        name: name
        description: 'The name of the Ajo.'
        required: true
        example: '"Weekly Savings Club"'
        type: string
        custom: []
      account_number:
        name: account_number
        description: 'The account number associated with the Ajo.'
        required: true
        example: '"1234567890"'
        type: string
        custom: []
      description:
        name: description
        description: 'A brief description of the Ajo.'
        required: true
        example: '"Ajo for weekly savings with community participation."'
        type: string
        custom: []
      frequency:
        name: frequency
        description: 'How often the Ajo cycle occurs.'
        required: true
        example: '"weekly"'
        type: string
        custom: []
      member_count:
        name: member_count
        description: 'The total number of members in the Ajo.'
        required: true
        example: 20
        type: integer
        custom: []
      starting_date:
        name: starting_date
        description: 'The start date of the Ajo. Format: YYYY-MM-DD.'
        required: true
        example: '"2024-08-01"'
        type: string
        custom: []
      cycle:
        name: cycle
        description: 'The duration of one complete cycle.'
        required: true
        example: '"4 weeks"'
        type: string
        custom: []
      amount_per_member:
        name: amount_per_member
        description: 'The amount each member contributes per cycle.'
        required: true
        example: 5000.0
        type: number
        custom: []
    responses:
      -
        status: 201
        content: |-
          {
              "id": 1,
              "name": "Weekly Savings Club",
              "account_number": "1234567890",
              "description": "Ajo for weekly savings with community participation.",
              "unique_code": "A1B2C3D4E5",
              "frequency": "weekly",
              "member_count": 20,
              "starting_date": "2024-08-01",
              "cycle": "4 weeks",
              "amount_per_member": 5000.00,
              "user_id": 1,
              "created_at": "2024-08-18T00:00:00.000000Z",
              "updated_at": "2024-08-18T00:00:00.000000Z"
          }
        headers: []
        description: '201'
      -
        status: 422
        content: |-
          {
              "message": "Validation Error",
              "errors": {
                  "name": ["The name field is required."],
                  "account_number": ["The account number field is required."],
                  "description": ["The description field is required."],
                  "frequency": ["The frequency field is required."],
                  "member_count": ["The member count field is required."],
                  "starting_date": ["The starting date field is required."],
                  "cycle": ["The cycle field is required."],
                  "amount_per_member": ["The amount per member field is required."]
              }
          }
        headers: []
        description: '422'
      -
        status: 500
        content: |-
          {
              "error": "Unsuccessful"
          }
        headers: []
        description: '500'
    responseFields: []
